<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Results</h2>
    {% if products %}
    <table border="1" cellspacing="0" cellpadding="6">
        <tr>
            <th>id</th>
            <th>prod_name</th>
            <th>price</th>
            <th>company</th>  
        </tr>
        {% for p in products %}
        <tr>
            <td>{{ p.id }}</td>
            <td>{{ p.prod_name }}</td>
            <td>{{ p.price }}</td>
            <td>{{ p.company }}</td>
        </tr>
        {% endfor %}

       
    </table>
    {% else %}
    <p>no phones with this company.</p>
    {% endif %}


   
    
</body>
</html>
